<div class="formulario-reserva">
  <h2><i class="fas fa-calendar-plus icono"></i> Nueva Reserva</h2>

  <form (ngSubmit)="submitReserva()">
    <div class="campo-form">
      <label for="txtFecha"><i class="fas fa-calendar-day"></i> Fecha</label>
      <input id="txtFecha" [(ngModel)]="reserva.fecha" type="date" required name="fecha">
    </div>

    <div class="campo-form">
      <label for="txtHoraIngreso"><i class="fas fa-clock"></i> Hora Ingreso</label>
      <input
        id="txtHoraIngreso"
        [(ngModel)]="reserva.horaIngreso"
        type="time"
        required
        name="horaIngreso"
        step="60"
        min="07:00"
        max="22:00"
      >
    </div>

    <div class="campo-form">
      <label for="txtHoraSalida"><i class="fas fa-hourglass-end"></i> Hora Salida</label>
      <input
        id="txtHoraSalida"
        [(ngModel)]="reserva.horaSalida"
        type="time"
        required
        name="horaSalida"
        step="60"
        min="07:00"
        max="22:00"
      >
    </div>

    <div class="campo-form">
      <label for="selectCancha"><i class="fas fa-futbol"></i> Seleccionar Cancha</label>
      <select id="selectCancha" [(ngModel)]="reserva.cancha.id" required name="cancha">
        <option [value]="cancha.id" *ngFor="let cancha of canchas">
          {{ cancha.direccion }} - {{ cancha.tipoCancha }}
        </option>
      </select>
    </div>

    <div class="campo-form centrar">
      <button type="submit" class="btn-reservar">
        <i class="fas fa-check-circle"></i> Reservar
      </button>
    </div>

    <div *ngIf="msgError" class="mensaje-error">
      <i class="fas fa-exclamation-triangle"></i> {{ msgError }}
    </div>
  </form>
</div>
